# Apenas testes. O DataSource real vem de EmbeddedPostgresTestConfig, nunca da VM.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/unused
spring.datasource.username=unused
spring.datasource.password=unused
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

app.jwt.secret=isolated-auth-flow-test-key-0123456789-0123456789
app.jwt.accessExpMinutes=20
app.jwt.refreshExpDays=7
app.cookie.accessName=ACCESS_TOKEN
app.cookie.refreshName=REFRESH_TOKEN
app.cookie.secure=false
app.cors.allowed-origins=http://localhost:5173
app.crypto.secret=test-only-crypto-secret-not-for-deployment
app.frontend.reset-password-url=http://localhost:5173/reset-password
app.mail.from=auth-tests@example.invalid

mercadolivre.client-id=test-only
mercadolivre.client-secret=test-only
mercadolivre.redirect-uri=http://localhost:5173
mercadolivre.oauth.state-secret=test-only-state-secret-not-for-deployment
spring.mail.host=127.0.0.1
spring.mail.port=1
spring.mail.username=test-only
spring.mail.password=test-only
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
management.health.rabbit.enabled=false
management.health.mail.enabled=false
